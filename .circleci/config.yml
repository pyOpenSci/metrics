version: 2.1

jobs:
  build-website:
    docker:
      - image: cimg/python:3.12-node
    steps:
      - checkout
      - run: python --version
      - run: node --version
      - run:
          name: Install uv
          command: |
            curl -LsSf https://astral.sh/uv/install.sh | sh
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Sync dependencies and build site
          command: |
            uv sync --frozen --no-dev --group build
            uv run quarto render
      - store_artifacts:
          path: _site/
          destination: html


workflows:
  version: 2
  build-website:
    jobs:
      - build-website
