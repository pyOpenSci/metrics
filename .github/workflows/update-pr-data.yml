name: Update issue, pr and contrib metadata file for current year

on:
  workflow_dispatch:
  schedule:
    # Runs on the 1 and 15 of each month at 00:00 UTC (see https://crontab.guru)
    - cron: "0 5 2,16 * 1"
    # Runs at 11pm on December 31st every year
    - cron: "0 23 31 12 *"

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  run-meta:
    if: github.repository_owner == 'pyopensci'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        with:
          persist-credentials: false
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install webp
        run: |
          sudo apt-get update
          sudo apt-get install -y webp
      - name: Sync dependencies
        run: uv sync --frozen --no-dev
      - name: Run get-prs
        run: uv run python scripts/get-prs.py
      - name: Run get-reviews
        run: uv run python scripts/get-reviews.py
      - name: Run get-sprint-data
        if: github.event_name == 'workflow_dispatch' ||
          github.event_name == 'schedule' ||
          ( github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository )
        env:
          GITHUB_TOKEN: ${{ secrets.PROJECTS_READ }}
        run: uv run python scripts/get-sprint-data.py
      - name: Update editors
        if: github.event_name == 'workflow_dispatch' ||
          github.event_name == 'schedule' ||
          ( github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository )
        env:
          GITHUB_TOKEN: ${{ secrets.PYOS_GHA_TEAMS_READ }}
        run: uv run python scripts/get-editors.py
      - name: get-review-contributors
        run: uv run python scripts/get-review-contributors.py
      - name: get-package-data
        run: uv run python scripts/get-package-data.py
      - name: Cache metrics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: metrics
          path: data

  create-pr:
    name: Create Pull Request
    runs-on: ubuntu-latest
    needs: run-meta
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Check out the code
        with:
          persist-credentials: false
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download metrics
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: metrics
          path: data
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          add-paths: |
            data/*.csv
          author: Leah <leah@pyopensci.org>
          base: main
          branch: contribs
          commit-message: "Update: issue, pr and contrib metadata file for current year"
          delete-branch: true
          title: Update contributor and review data
        env:
          # Custom token needed to trigger PR checks, as GITHUB_TOKEN won't
          # https://github.com/peter-evans/create-pull-request/blob/main/docs/concepts-guidelines.md#triggering-further-workflow-runs
          GITHUB_TOKEN: ${{ secrets.PYOS_PR_TOKEN }}
